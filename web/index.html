<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the page use the whole iPhone screen, including around the notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Smart Mirror</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, system-ui, sans-serif;
      overflow: hidden;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;        /* the real visible height on iPhone Safari */
      overflow: hidden;
    }
    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .mirrored { transform: scaleX(-1); }   /* flip like a real mirror */

    /* Big, high-contrast text you can read from 2-3 metres away */
    .big-text {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      max-width: 92vw;
      text-align: center;
      font-weight: 800;
      line-height: 1.1;
      padding: 0.2em 0.6em;
      border-radius: 0.4em;
      background: rgba(0, 0, 0, 0.75);
    }
    .big-text:empty { display: none; }

    #reps {
      top: calc(env(safe-area-inset-top) + 2vh);
      font-size: clamp(48px, 16vw, 120px);
      color: #ffffff;
    }
    #knee {
      top: calc(env(safe-area-inset-top) + 2vh + clamp(64px, 20vw, 150px));
      font-size: clamp(22px, 6vw, 44px);
      color: #fff200;        /* bright yellow */
    }
    #cue {
      bottom: calc(env(safe-area-inset-bottom) + 80px);
      font-size: clamp(34px, 10vw, 80px);
    }
    #status {
      bottom: calc(env(safe-area-inset-bottom) + 80px);
      font-size: clamp(20px, 6vw, 40px);
      color: #ffffff;
    }

    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(22px, 6vw, 32px);
      font-weight: 700;
      padding: 18px 36px;
      border: none;
      border-radius: 16px;
      background: #00c853;
      color: #fff;
    }
    #startBtn:disabled { background: #555; }

    /* Small buttons along the bottom */
    #toolbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom) + 12px);
      display: none;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 8px;
    }
    #toolbar button {
      font-size: 16px;
      font-weight: 600;
      padding: 10px 14px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="reps" class="big-text"></div>
    <div id="knee" class="big-text"></div>
    <div id="cue" class="big-text"></div>
    <div id="status" class="big-text">Loading the AI model...</div>
    <button id="startBtn" disabled>Start camera</button>
    <div id="toolbar">
      <button id="newSetBtn">New set</button>
      <button id="soundBtn">Sound: on</button>
      <button id="saveBtn">Save log</button>
      <button id="flipBtn">Switch camera</button>
    </div>
  </div>

  <script type="module">
    import { PoseLandmarker, FilesetResolver } from
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    // ---------- Squat settings (from your own measurements; tune these) ----------
    const DOWN = 120;         // knee angle below this = you're squatting
    const UP = 155;           // knee angle above this = standing again (rep done)
    const DEEP_ENOUGH = 80;   // lowest knee angle must get below this for a "Good rep!"
    const CUE_SECONDS = 2;    // how long a cue stays on screen

    // ---------- Side-on check (Dr. Bini: trust bending angles only from the side) ----------
    // When you face the camera, your shoulders look wide; side-on, they line up and look narrow.
    const SIDE_ON_LIMIT = 20;          // degrees away from side-on before "Turn sideways" (try 10 later)
    const SHOULDER_RATIO_FRONT = 0.75; // shoulder width ÷ torso length when facing the camera (typical)

    // ---------- "Can I see you?" check ----------
    const VIS_OK = 0.5;                // a point counts as visible above this score
    const LOST_FRAMES = 15;            // about half a second of not seeing you before warning

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const repsEl = document.getElementById("reps");
    const kneeEl = document.getElementById("knee");
    const cueEl = document.getElementById("cue");
    const statusEl = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const toolbar = document.getElementById("toolbar");
    const flipBtn = document.getElementById("flipBtn");
    const newSetBtn = document.getElementById("newSetBtn");
    const soundBtn = document.getElementById("soundBtn");
    const saveBtn = document.getElementById("saveBtn");

    // Body points only (no face): shoulders, elbows, wrists, hips, knees, ankles
    const BODY_POINTS = [11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];
    const BONES = [
      [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
      [11, 23], [12, 24], [23, 24],
      [23, 25], [25, 27], [24, 26], [26, 28]
    ];
    const LEFT_LEG = [23, 25, 27];    // hip, knee, ankle
    const RIGHT_LEG = [24, 26, 28];

    // Angle at point b, in degrees
    function angle(a, b, c) {
      const bax = a.x - b.x, bay = a.y - b.y;
      const bcx = c.x - b.x, bcy = c.y - b.y;
      const dot = bax * bcx + bay * bcy;
      const mag = Math.hypot(bax, bay) * Math.hypot(bcx, bcy) + 1e-6;
      return Math.acos(Math.min(1, Math.max(-1, dot / mag))) * 180 / Math.PI;
    }

    // Smoothing: average of the last 5 readings
    const kneeHistory = [];
    function smooth(value) {
      kneeHistory.push(value);
      if (kneeHistory.length > 5) kneeHistory.shift();
      return kneeHistory.reduce((s, v) => s + v, 0) / kneeHistory.length;
    }

    // ---------- Rep counter state ----------
    let state = "up";
    let reps = 0;             // good reps only
    let shallow = 0;          // reps that weren't deep enough (not counted)
    let setNumber = 1;
    let lowestKnee = 180;
    let lowestHipGap = 99;
    let cueUntil = 0;
    const log = [];           // every rep, for your accuracy testing

    function showReps() {
      repsEl.textContent = shallow > 0 ? `Reps ${reps} · ${shallow} shallow` : `Reps ${reps}`;
    }

    function showCue(text, color) {
      cueEl.textContent = text;
      cueEl.style.color = color;
      cueUntil = performance.now() + CUE_SECONDS * 1000;
    }

    // Spoken cues, so you don't have to read the screen mid-rep
    let soundOn = true;

    // Ask iPhone to play sound through the speaker even on silent mode / while the camera is on
    // (works on newer iPhones; older ones just ignore it)
    function useLoudSpeaker() {
      try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    }

    // Beeps: a backup in case spoken feedback is blocked. Built in code, so no sound files needed.
    function makeBeep(freq, ms) {
      const rate = 22050, n = Math.floor(rate * ms / 1000);
      const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
      const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true);
      v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
      for (let i = 0; i < n; i++) {
        const fade = Math.min(1, i / 200, (n - i) / 200);   // avoid clicks
        v.setInt16(44 + i * 2, Math.sin(2 * Math.PI * freq * i / rate) * 0.6 * fade * 32767, true);
      }
      return new Audio(URL.createObjectURL(new Blob([buf], { type: "audio/wav" })));
    }
    const goodBeep = makeBeep(880, 180);   // high beep = good rep
    const lowBeep = makeBeep(330, 300);    // low beep = too shallow / warning

    function beep(sound) {
      if (!soundOn) return;
      try { sound.currentTime = 0; sound.play().catch(() => {}); } catch (e) {}
    }

    // Must run inside a tap: iPhone only allows sound that starts from one
    function unlockSound() {
      useLoudSpeaker();
      for (const s of [goodBeep, lowBeep]) {
        s.muted = true;
        s.play().then(() => { s.pause(); s.currentTime = 0; s.muted = false; })
                .catch(() => { s.muted = false; });
      }
    }

    function speakNow(text) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      const voice = speechSynthesis.getVoices().find((vc) => vc.lang && vc.lang.startsWith("en"));
      if (voice) u.voice = voice;
      u.rate = 1.05;
      u.volume = 1;
      speechSynthesis.speak(u);
    }
    function say(text) {
      if (!soundOn || !("speechSynthesis" in window) || !text) return;
      if (speechSynthesis.speaking || speechSynthesis.pending) {
        // iPhone bug: speaking right after cancel() gets dropped, so wait a moment
        speechSynthesis.cancel();
        setTimeout(() => speakNow(text), 120);
      } else {
        speakNow(text);
      }
    }

    function updateReps(knee, hipGap) {
      if (state === "up" && knee < DOWN) {
        state = "down";
        lowestKnee = knee;
        lowestHipGap = hipGap;
      } else if (state === "down") {
        lowestKnee = Math.min(lowestKnee, knee);
        lowestHipGap = Math.min(lowestHipGap, hipGap);
        if (knee > UP) {
          // Back up = one finished attempt. Only deep-enough reps count.
          state = "up";
          const good = lowestKnee <= DEEP_ENOUGH;
          if (good) {
            reps += 1;
            showCue("Good rep!", "#00e676");
            beep(goodBeep);
            say(String(reps));
          } else {
            shallow += 1;
            showCue("Too shallow – go lower", "#ffab00");
            beep(lowBeep);
            say("Lower");
          }
          showReps();
          const entry = {
            set: setNumber,
            attempt: reps + shallow,
            counted: good ? "yes" : "no",
            lowestKnee: Math.round(lowestKnee),
            lowestHipGap: lowestHipGap.toFixed(2),
            cue: good ? "Good rep" : "Too shallow",
            time: new Date().toLocaleTimeString()
          };
          log.push(entry);
          console.log(entry);
        }
      }
    }

    // ---------- 1. Load the AI model ----------
    let landmarker;
    async function loadModel() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      const MODEL = (size) =>
        `https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_${size}/float16/latest/pose_landmarker_${size}.task`;
      const options = (size, delegate) => ({
        baseOptions: { modelAssetPath: MODEL(size), delegate },
        runningMode: "VIDEO",
        numPoses: 1,
        // Slightly lower than the defaults (0.5), so it finds you faster
        minPoseDetectionConfidence: 0.4,
        minPosePresenceConfidence: 0.4,
        minTrackingConfidence: 0.4
      });
      try {
        // "full" model: better at legs and ankles than "lite"; fast enough on a phone's GPU
        landmarker = await PoseLandmarker.createFromOptions(vision, options("full", "GPU"));
      } catch (e) {
        // No GPU available: use the smaller model so it stays smooth
        landmarker = await PoseLandmarker.createFromOptions(vision, options("lite", "CPU"));
      }
      statusEl.textContent = "Ready";
      startBtn.disabled = false;
    }

    // ---------- 2. Camera: front camera by default ----------
    let facing = "user";      // "user" = front camera, "environment" = back camera
    let stream = null;
    let looping = false;

    async function startCamera() {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      statusEl.textContent = "Starting camera...";

      const portrait = window.innerHeight > window.innerWidth;
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: facing },
          width: { ideal: portrait ? 720 : 1280 },
          height: { ideal: portrait ? 1280 : 720 }
        },
        audio: false
      });
      video.srcObject = stream;
      await video.play();

      // Mirror the front camera; don't mirror the back camera
      const actual = stream.getVideoTracks()[0].getSettings().facingMode || facing;
      const mirror = actual !== "environment";
      video.classList.toggle("mirrored", mirror);
      canvas.classList.toggle("mirrored", mirror);

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      kneeHistory.length = 0;

      startBtn.style.display = "none";
      toolbar.style.display = "flex";
      showReps();
      statusEl.textContent = "Stand side-on, 2-3 metres away";
      setTimeout(() => { if (statusEl.textContent.startsWith("Stand")) statusEl.textContent = ""; }, 5000);

      keepScreenOn();
      if (!looping) { looping = true; requestAnimationFrame(loop); }
    }

    // Stop the phone screen from going to sleep mid-workout (if supported)
    async function keepScreenOn() {
      try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) {}
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && stream) keepScreenOn();
    });

    // ---------- 3. Every frame: find the body, draw it, count reps ----------
    let lastVideoTime = -1;
    function loop() {
      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }
        draw(landmarker.detectForVideo(video, performance.now()));
      }
      // Hide the cue once its time is up
      if (cueEl.textContent && performance.now() > cueUntil) cueEl.textContent = "";
      requestAnimationFrame(loop);
    }

    let lostFrames = 0;           // frames in a row where it couldn't see you properly
    let turnedWarned = false;     // so "Turn sideways" is spoken once, not every frame
    const sideHistory = [];       // last few side-on estimates, for smoothing

    // Warn only after ~half a second, so a single bad frame doesn't flash a warning
    function cantSeeYou(message) {
      lostFrames += 1;
      if (lostFrames >= LOST_FRAMES) {
        kneeEl.textContent = "";
        showCue(message, "#ff4d4d");
      }
    }

    // How far you are turned away from side-on, in degrees (0 = perfectly side-on, 90 = facing the camera)
    function degreesFromSideOn(p) {
      const shoulderWidth = Math.abs(p(11).x - p(12).x);
      const midShoulder = { x: (p(11).x + p(12).x) / 2, y: (p(11).y + p(12).y) / 2 };
      const midHip = { x: (p(23).x + p(24).x) / 2, y: (p(23).y + p(24).y) / 2 };
      const torso = Math.max(Math.hypot(midShoulder.x - midHip.x, midShoulder.y - midHip.y), 1);
      const ratio = Math.min(1, (shoulderWidth / torso) / SHOULDER_RATIO_FRONT);
      sideHistory.push(Math.asin(ratio) * 180 / Math.PI);
      if (sideHistory.length > 10) sideHistory.shift();
      return sideHistory.reduce((s, v) => s + v, 0) / sideHistory.length;
    }

    function draw(result) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!result.landmarks || result.landmarks.length === 0) {
        cantSeeYou("Step back so your whole body is on screen");
        return;
      }
      const lms = result.landmarks[0];
      const p = (i) => ({ x: lms[i].x * canvas.width, y: lms[i].y * canvas.height });

      // Thick lines and dots, visible from a distance
      const scale = Math.max(canvas.width, canvas.height) / 1280;
      ctx.lineCap = "round";
      ctx.strokeStyle = "white";
      ctx.lineWidth = 6 * scale;
      for (const [a, b] of BONES) {
        ctx.beginPath();
        ctx.moveTo(p(a).x, p(a).y);
        ctx.lineTo(p(b).x, p(b).y);
        ctx.stroke();
      }
      ctx.fillStyle = "#00e676";
      for (const i of BODY_POINTS) {
        ctx.beginPath();
        ctx.arc(p(i).x, p(i).y, 9 * scale, 0, 2 * Math.PI);
        ctx.fill();
      }

      // Pick the leg closest to the camera (highest visibility)
      const vis = (leg) => leg.reduce((s, i) => s + lms[i].visibility, 0);
      const [hip, knee, ankle] = vis(LEFT_LEG) >= vis(RIGHT_LEG) ? LEFT_LEG : RIGHT_LEG;
      const legVis = Math.min(lms[hip].visibility, lms[knee].visibility, lms[ankle].visibility);

      // Highlight the measured leg in yellow
      ctx.strokeStyle = "#fff200";
      ctx.lineWidth = 12 * scale;
      ctx.beginPath();
      ctx.moveTo(p(hip).x, p(hip).y);
      ctx.lineTo(p(knee).x, p(knee).y);
      ctx.lineTo(p(ankle).x, p(ankle).y);
      ctx.stroke();

      if (legVis < VIS_OK) {
        // Can't see the leg properly: warn and don't count
        cantSeeYou("Step back — I can't see your legs");
        return;
      }
      lostFrames = 0;
      if (cueEl.textContent.startsWith("Step back")) cueEl.textContent = "";

      // Side-on check: angles are only trustworthy within a few degrees of side-on
      const turned = degreesFromSideOn(p);
      if (turned > SIDE_ON_LIMIT) {
        kneeEl.textContent = "";
        showCue("Turn sideways to the camera", "#ff4d4d");
        if (!turnedWarned) { beep(lowBeep); say("Turn sideways"); turnedWarned = true; }
        return;   // pause counting while you're facing the camera
      }
      turnedWarned = false;
      if (cueEl.textContent.startsWith("Turn sideways")) cueEl.textContent = "";

      const kneeAngle = smooth(angle(p(hip), p(knee), p(ankle)));
      // Hip gap: how far the hip is above the knee, divided by shin length.
      // About 0 = hip level with knee; negative = hip below knee. (Logged for research.)
      const shin = Math.max(Math.hypot(p(ankle).x - p(knee).x, p(ankle).y - p(knee).y), 1);
      const hipGap = (p(knee).y - p(hip).y) / shin;

      kneeEl.textContent = `Knee ${kneeAngle.toFixed(0)}°`;
      updateReps(kneeAngle, hipGap);
    }

    // ---------- Buttons ----------
    startBtn.addEventListener("click", () => {
      // iPhone only allows sound that starts from a tap, so unlock it and say something real now
      unlockSound();
      say("Let's go");
      startCamera().catch((err) => { statusEl.textContent = "Camera error: " + err.message; });
    });

    flipBtn.addEventListener("click", () => {
      facing = facing === "user" ? "environment" : "user";
      startCamera().catch((err) => { statusEl.textContent = "Camera error: " + err.message; });
    });

    newSetBtn.addEventListener("click", () => {
      if (reps + shallow > 0) setNumber += 1;
      reps = 0;
      shallow = 0;
      state = "up";
      showReps();
      showCue(`Set ${setNumber}`, "#ffffff");
    });

    soundBtn.addEventListener("click", () => {
      soundOn = !soundOn;
      soundBtn.textContent = `Sound: ${soundOn ? "on" : "off"}`;
      if (!soundOn && "speechSynthesis" in window) speechSynthesis.cancel();
      if (soundOn) {
        // Tapping "Sound: on" is also a sound test, and re-unlocks sound on iPhone
        useLoudSpeaker();
        beep(goodBeep);   // playing straight from a tap also unlocks it
        say("Sound on");
      }
    });

    // Save every rep as a spreadsheet file (CSV), for your accuracy testing
    saveBtn.addEventListener("click", () => {
      if (log.length === 0) { showCue("No reps yet", "#ffffff"); return; }
      const header = "set,attempt,counted,lowest_knee_deg,lowest_hip_gap,cue,time";
      const rows = log.map((r) => [r.set, r.attempt, r.counted, r.lowestKnee, r.lowestHipGap, r.cue, r.time].join(","));
      const blob = new Blob([[header, ...rows].join("\n")], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `mirror-log-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    });

    loadModel().catch((err) => { statusEl.textContent = "Model error: " + err.message; });
  </script>
</body>
</html>
