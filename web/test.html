<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mirror Speed Test</title>
  <!-- Speed test: ONLY the camera + AI + skeleton. No sound, no reps, no advice.
       If this is smooth but the main page lags, the lag is in the extra code.
       If this lags too, it's the phone/browser. -->
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff;
      font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
    #stage { position: fixed; inset: 0; width: 100vw; height: 100dvh; overflow: hidden; }
    video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .mirrored { transform: scaleX(-1); }
    #perf { position: absolute; left: 8px; top: calc(env(safe-area-inset-top) + 8px);
      font: 600 15px ui-monospace, Menlo, monospace; background: rgba(0,0,0,0.7);
      padding: 6px 10px; border-radius: 8px; white-space: pre; }
    #controls { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; gap: 14px; align-items: center; }
    button { font-size: 22px; font-weight: 700; padding: 16px 28px; border: none;
      border-radius: 14px; background: #00c853; color: #fff; }
    button:disabled { background: #555; }
    #cpuBtn { background: #555; font-size: 18px; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="perf">Loading the AI model...</div>
    <div id="controls">
      <button id="gpuBtn" disabled>Start (GPU)</button>
      <button id="cpuBtn" disabled>Start (CPU)</button>
    </div>
  </div>
  <script type="module">
    import { PoseLandmarker, FilesetResolver } from
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const perfEl = document.getElementById("perf");
    const BONES = [[11,12],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
    const MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task";

    let vision, landmarker, mode = "";
    FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm")
      .then((v) => { vision = v; perfEl.textContent = "Ready: pick GPU or CPU";
        document.getElementById("gpuBtn").disabled = false; document.getElementById("cpuBtn").disabled = false; })
      .catch((e) => { perfEl.textContent = "Error: " + e.message; });

    async function start(delegate) {
      perfEl.textContent = "Loading " + delegate + "...";
      try {
        landmarker = await PoseLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: MODEL, delegate }, runningMode: "VIDEO", numPoses: 1 });
        mode = delegate;
      } catch (e) {
        landmarker = await PoseLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: MODEL, delegate: "CPU" }, runningMode: "VIDEO", numPoses: 1 });
        mode = "CPU (GPU failed)";
      }
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 480 }, height: { ideal: 640 } }, audio: false });
      video.srcObject = stream;
      await video.play();
      video.classList.add("mirrored"); canvas.classList.add("mirrored");
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      document.getElementById("controls").style.display = "none";
      requestAnimationFrame(loop);
    }
    document.getElementById("gpuBtn").addEventListener("click", () => start("GPU").catch((e) => perfEl.textContent = "Error: " + e.message));
    document.getElementById("cpuBtn").addEventListener("click", () => start("CPU").catch((e) => perfEl.textContent = "Error: " + e.message));

    let lastTime = -1, lastTs = 0, ai = 0, checks = 0, frames = 0, since = performance.now();
    function loop() {
      const now = performance.now();
      if (video.readyState >= 2 && video.currentTime !== lastTime) {
        lastTime = video.currentTime;
        const ts = Math.max(Math.round(now), lastTs + 1); lastTs = ts;
        const t0 = performance.now();
        const r = landmarker.detectForVideo(video, ts);
        ai = ai * 0.9 + (performance.now() - t0) * 0.1;
        checks += 1;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (r.landmarks && r.landmarks[0]) {
          const l = r.landmarks[0], p = (i) => [l[i].x * canvas.width, l[i].y * canvas.height];
          ctx.strokeStyle = "#fff200"; ctx.lineWidth = 6; ctx.lineCap = "round";
          for (const [a, b] of BONES) { ctx.beginPath(); ctx.moveTo(...p(a)); ctx.lineTo(...p(b)); ctx.stroke(); }
        }
      }
      frames += 1;
      if (now - since >= 1000) {
        const s = (now - since) / 1000;
        perfEl.textContent = `TEST · ${mode}\nAI ${ai.toFixed(0)} ms per check\n${(checks / s).toFixed(0)} checks/s · screen ${(frames / s).toFixed(0)} fps`;
        since = now; checks = 0; frames = 0;
      }
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
